name: Generate scene images
on:
  push:
    branches: [ccr-0e5a065a-tb7dba]
    paths: [".github/imagegen-request.txt"]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
      - name: Generate images
        run: python pipeline/gen_images_pollinations.py "$(head -1 .github/imagegen-request.txt)"
      - name: Final commit
        if: always()
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add projects/*/images || true
          git commit -m "Generated scene images ($(head -1 .github/imagegen-request.txt))" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
