<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Image Generator</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e2e0da; --accent: #3b5bdb; --accent-text: #ffffff; --error: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e22; --text: #ededf0; --muted: #9a9aa2;
      --border: #303036; --accent: #748ffc; --accent-text: #0b0b0d; --error: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  textarea, select, input[type=file] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-text);
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .55; cursor: wait; }
  #status { font-size: .9rem; color: var(--muted); }
  #status.error { color: var(--error); }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 24px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { padding: 10px 12px; font-size: .85rem; color: var(--muted); display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  figcaption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  figcaption a { color: var(--accent); font-weight: 600; text-decoration: none; flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <h1>Gemini Image Generator</h1>
  <p class="sub">Free Gemini image generation through Puter.js. You sign in once with a free Puter account, and usage counts against that account.</p>

  <div class="card">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="A cozy reading nook by a rainy window, warm lamp light, watercolor style"></textarea>

    <div class="row">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="gemini-3.1-flash-image">Gemini 3.1 Flash Image (Nano Banana 2)</option>
          <option value="gemini-3-pro-image-preview">Gemini 3 Pro Image (Nano Banana Pro)</option>
          <option value="gemini-2.5-flash-image">Gemini 2.5 Flash Image (Nano Banana)</option>
        </select>
      </div>
      <div>
        <label for="ratio">Aspect ratio</label>
        <select id="ratio">
          <option value="1:1">1:1 Square</option>
          <option value="16:9">16:9 Landscape</option>
          <option value="9:16">9:16 Portrait / Reels</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
        </select>
      </div>
      <div>
        <label for="quality">Size</label>
        <select id="quality">
          <option value="1K">1K</option>
          <option value="2K">2K</option>
          <option value="4K">4K</option>
        </select>
      </div>
    </div>

    <div style="margin-top:12px">
      <label for="ref">Reference image (optional, for editing)</label>
      <input type="file" id="ref" accept="image/*">
    </div>

    <div class="actions">
      <button id="go">Generate</button>
      <button id="auth" class="secondary">Sign in to Puter</button>
      <span id="status"></span>
    </div>
  </div>

  <div id="gallery"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  async function refreshAuth() {
    try {
      if (puter.auth.isSignedIn()) {
        const user = await puter.auth.getUser();
        $('auth').textContent = 'Signed in as ' + user.username + ' (sign out)';
      } else {
        $('auth').textContent = 'Sign in to Puter';
      }
    } catch (e) { /* ignore */ }
  }

  $('auth').addEventListener('click', async () => {
    try {
      if (puter.auth.isSignedIn()) { await puter.auth.signOut(); }
      else { await puter.auth.signIn(); }
    } catch (e) { setStatus('Sign-in was cancelled or blocked. Allow pop-ups for this page.', true); }
    refreshAuth();
  });

  $('go').addEventListener('click', async () => {
    const prompt = $('prompt').value.trim();
    if (!prompt) { setStatus('Type a prompt first.', true); return; }

    const [w, h] = $('ratio').value.split(':').map(Number);
    const options = {
      prompt,
      provider: 'gemini',
      model: $('model').value,
      quality: $('quality').value,
      ratio: { w, h },
    };
    const file = $('ref').files[0];
    if (file) { options.input_image = file; options.input_image_mime_type = file.type; }

    $('go').disabled = true;
    setStatus('Generating… this can take 10–40 seconds.');
    try {
      const img = await puter.ai.txt2img(options);
      addToGallery(img.src, prompt, options.model);
      setStatus('Done.');
    } catch (err) {
      const msg = (err && (err.message || err.error?.message)) || JSON.stringify(err);
      setStatus('Failed: ' + msg + ' — try another model or size.', true);
    } finally {
      $('go').disabled = false;
      refreshAuth();
    }
  });

  function addToGallery(src, prompt, model) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = src; img.alt = prompt;
    const cap = document.createElement('figcaption');
    const text = document.createElement('span');
    text.textContent = prompt; text.title = prompt + ' — ' + model;
    const dl = document.createElement('a');
    dl.href = src; dl.download = 'gemini-' + Date.now() + '.png'; dl.textContent = 'Download';
    cap.append(text, dl);
    fig.append(img, cap);
    $('gallery').prepend(fig);
  }

  refreshAuth();
</script>
</body>
</html>
