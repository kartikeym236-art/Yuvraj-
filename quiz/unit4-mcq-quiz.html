<style>

.cell.cur{outline:2px solid var(--accent);outline-offset:1px}

.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--panel-2);border:1px solid var(--line)}
.legend .lo::before{background:var(--good-bg);border-color:var(--good)} .legend .ln::before{background:var(--bad-bg);border-color:var(--bad)}

.tile b{display:block;font-family:var(--display);font-size:clamp(22px,6vw,32px);font-variant-numeric:tabular-nums}

.tile.g b{color:var(--good)} .tile.r b{color:var(--bad)}
.sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sec-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}
.sec-top span:last-child{font-variant-numeric:tabular-nums}
.sec small{color:var(--muted)}
.sec .bar i{background:var(--good)}
h2{font-family:var(--display);font-size:20px;margin:0}
@media (max-width:440px){.tiles{gap:6px}.tile{padding:10px 6px}.nav .btn{max-width:none}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

const QS = [{"n":1,"star":true,"q":"The word \"motivation\" comes from the Latin word movere, which means:","o":["to think","to move","to learn","to want"],"a":1},{"n":2,"star":true,"q":"Motivation is best described as:","o":["an outer reward","an inner force that starts, directs and sustains behaviour","a teaching method","a test score"],"a":1},{"n":3,"star":false,"q":"Which is NOT a function of motivation?","o":["starting behaviour","directing behaviour","sustaining behaviour","measuring intelligence"],"a":3},{"n":4,"star":false,"q":"The correct order of the motivation cycle is:","o":["Drive → Need → Goal → Action","Need → Drive → Action → Goal","Goal → Need → Drive → Action","Action → Goal → Need → Drive"],"a":1},{"n":5,"star":false,"q":"A \"need\" is:","o":["a state of lack or deficiency","a reward","a goal reached","a habit"],"a":0},{"n":6,"star":false,"q":"A \"drive\" is:","o":["the reward at the end","the aroused state of tension that pushes action","the teacher's plan","the final goal"],"a":1},{"n":7,"star":false,"q":"An \"incentive\" is:","o":["an inner need","an external object or reward that attracts behaviour","a punishment only","an instinct"],"a":1},{"n":8,"star":false,"q":"Motivation is called \"goal-directed\" because:","o":["it has no aim","it always aims at reaching some goal","it is random","it is only for exams"],"a":1},{"n":9,"star":false,"q":"We cannot see motivation directly; we only infer it from behaviour. This shows motivation is:","o":["an internal state","a physical object","a test","a reflex"],"a":0},{"n":10,"star":false,"q":"Motivation of a learner may be high on Monday and low on Friday. This shows motivation:","o":["is fixed","fluctuates","is inborn only","cannot change"],"a":1},{"n":11,"star":false,"q":"Which statement about motivation is TRUE?","o":["It is the same in all children","It can be learned and changed by the teacher","It never changes","It only comes from punishment"],"a":1},{"n":12,"star":true,"q":"Motivation in learning is important mainly because it:","o":["replaces teaching","increases attention, effort and persistence","removes the need for books","reduces the syllabus"],"a":1},{"n":13,"star":false,"q":"A motivated learner is more likely to:","o":["give up quickly","keep trying after failure","avoid tasks","disturb the class"],"a":1},{"n":14,"star":false,"q":"Good motivation in class usually leads to:","o":["more discipline problems","fewer discipline problems","no learning","more absenteeism"],"a":1},{"n":15,"star":false,"q":"\"Motivation is the heart of the teaching-learning process.\" This means:","o":["learning happens without it","without motivation, real learning is hard","only teachers need it","it matters only in sports"],"a":1},{"n":16,"star":true,"q":"Intrinsic motivation comes from:","o":["prizes","marks","the learner's own interest and joy in the activity","fear of punishment"],"a":2},{"n":17,"star":true,"q":"Extrinsic motivation comes from:","o":["curiosity","inner joy","external rewards or punishments","self-satisfaction"],"a":2},{"n":18,"star":false,"q":"A child reads storybooks because she loves stories. This is:","o":["extrinsic motivation","intrinsic motivation","negative motivation","no motivation"],"a":1},{"n":19,"star":false,"q":"A child studies only to get a gold star. This is:","o":["intrinsic motivation","extrinsic motivation","self-actualisation","curiosity"],"a":1},{"n":20,"star":false,"q":"Which is an example of intrinsic motivation?","o":["studying for a cash prize","solving puzzles for fun","working to avoid scolding","studying for a certificate"],"a":1},{"n":21,"star":false,"q":"Which is an example of extrinsic motivation?","o":["curiosity","love of music","praise from the teacher","the joy of drawing"],"a":2},{"n":22,"star":true,"q":"Which type of motivation lasts longer?","o":["extrinsic","intrinsic","both equal","neither"],"a":1},{"n":23,"star":false,"q":"Learning driven by intrinsic motivation is usually:","o":["shallow and rote","deep and meaningful","forgotten quickly","forced"],"a":1},{"n":24,"star":false,"q":"Extrinsic motivation is most useful for:","o":["starting a new or boring task","replacing all interest","lifelong learning","nothing"],"a":0},{"n":25,"star":false,"q":"When too many rewards reduce a child's natural interest in an activity, it is called:","o":["Pygmalion effect","Halo effect","Overjustification effect","Hawthorne effect"],"a":2},{"n":26,"star":false,"q":"A teacher should gradually move learners from:","o":["intrinsic to extrinsic","extrinsic to intrinsic","motivation to punishment","praise to fear"],"a":1},{"n":27,"star":false,"q":"Marks, grades, prizes and certificates are:","o":["intrinsic motivators","extrinsic motivators","instincts","needs"],"a":1},{"n":28,"star":false,"q":"Curiosity, interest and a sense of achievement are:","o":["extrinsic motivators","intrinsic motivators","punishments","incentives"],"a":1},{"n":29,"star":false,"q":"Fear of punishment as a motivator is called:","o":["positive motivation","negative motivation","intrinsic motivation","self-motivation"],"a":1},{"n":30,"star":false,"q":"Praise and rewards are examples of:","o":["negative motivation","positive motivation","no motivation","instinct"],"a":1},{"n":31,"star":true,"q":"Maslow's hierarchy of needs places at the BOTTOM:","o":["self-actualisation","esteem needs","physiological needs","love and belonging"],"a":2},{"n":32,"star":true,"q":"The highest need in Maslow's hierarchy is:","o":["safety","esteem","self- actualisation","hunger"],"a":2},{"n":33,"star":false,"q":"The correct order of Maslow's needs from bottom to top is:","o":["Safety, Physiological, Esteem, Love, Self-actualisation","Physiological, Safety, Love/Belonging, Esteem, Self-actualisation","Esteem, Love, Safety, Physiological, Self-actualisation","Love, Safety, Physiological, Esteem, Self-actualisation"],"a":1},{"n":34,"star":false,"q":"A hungry child cannot concentrate in class. This is best explained by:","o":["Maslow's need theory","Pavlov's theory","sociometry","Tuckman's model"],"a":0},{"n":35,"star":false,"q":"Who proposed the hierarchy of needs?","o":["Skinner","Abraham Maslow","Kurt Lewin","Moreno"],"a":1},{"n":36,"star":false,"q":"Achievement motivation (need for achievement) is linked with:","o":["David McClelland","Moreno","Tuckman","Aronson"],"a":0},{"n":37,"star":false,"q":"A child who believes \"I failed because I did not work hard\" is showing:","o":["attribution to effort","attribution to luck","attribution to the teacher","no attribution"],"a":0},{"n":38,"star":false,"q":"Bernard Weiner is linked with:","o":["Attribution theory of motivation","Sociometry","Group stages","Hierarchy of needs"],"a":0},{"n":39,"star":false,"q":"Positive reinforcement to strengthen behaviour was mainly explained by:","o":["B. F. Skinner","Maslow","Lewin","Moreno"],"a":0},{"n":40,"star":true,"q":"The best way to praise a learner is to praise:","o":["only toppers","the effort and the specific work","only high marks","in a general way, \"good\""],"a":1},{"n":41,"star":false,"q":"Teaching fractions using pizza slices is an example of:","o":["relating learning to real life","punishment","rote learning","negative motivation"],"a":0},{"n":42,"star":false,"q":"Starting a lesson with a puzzle or a surprising question mainly helps to:","o":["waste time","arouse curiosity","punish students","test memory"],"a":1},{"n":43,"star":false,"q":"Quick feedback motivates learners because:","o":["it tells them at once what is right and what to fix","it delays learning","it increases fear","it replaces teaching"],"a":0},{"n":44,"star":true,"q":"\"Success breeds success\" means a teacher should:","o":["give only very hard tasks","give small, achievable goals so children taste success","never give goals","give tasks without help"],"a":1},{"n":45,"star":false,"q":"Tasks for motivation should be:","o":["too easy","too hard","of moderate difficulty, matched to the learner's level","the same for all"],"a":2},{"n":46,"star":true,"q":"The Pygmalion effect means:","o":["a teacher's high expectations improve a child's performance","rewards reduce interest","group members fight","children copy each other"],"a":0},{"n":47,"star":false,"q":"The Pygmalion effect is also called:","o":["the Rosenthal effect","the Halo effect","the Hawthorne effect","the Zeigarnik effect"],"a":0},{"n":48,"star":false,"q":"Healthy competition in class should mainly be:","o":["only between toppers","with one's own past performance and in teams","based on humiliation","avoided always"],"a":1},{"n":49,"star":false,"q":"Giving learners a choice of topic or task mainly increases their:","o":["fear","autonomy and interest","dependence","boredom"],"a":1},{"n":50,"star":false,"q":"Using games, projects and activities motivates because learners are:","o":["passive","actively involved","punished","silent"],"a":1},{"n":51,"star":false,"q":"Using varied audio-visual aids in teaching mainly helps to:","o":["hold attention and interest","finish syllabus fast","avoid questions","reduce marks"],"a":0},{"n":52,"star":false,"q":"Which is the LEAST effective way to motivate learners?","o":["praise","curiosity","constant threats and punishment","real-life examples"],"a":2},{"n":53,"star":false,"q":"A teacher who is enthusiastic about the subject motivates students by acting as a:","o":["role model","judge","manager only","controller"],"a":0},{"n":54,"star":false,"q":"\"Level of aspiration\" refers to:","o":["the goal a person expects to reach","the IQ score","the class size","the punishment"],"a":0},{"n":55,"star":false,"q":"Self-efficacy (belief in one's own ability) was given by:","o":["Albert Bandura","Maslow","Moreno","Tuckman"],"a":0},{"n":56,"star":false,"q":"Optimising learning means:","o":["making learning as effective as possible","reducing learning","testing more","punishing more"],"a":0},{"n":57,"star":false,"q":"A learner who learns for the joy of learning is called:","o":["a self-motivated learner","a passive learner","an isola   const done = Object.keys(st.ans).length, ok = QS.filter(isOk).length;
  $("sAns").textContent = done + "/200"; $("sOk").textContent = ok; $("sNo").textContent = done - ok;
  $("prog").style.width = (done/2) + "%";
}
function renderQ(){
  const l = list(); if (!l.length) { st.only=""; st.filter="all"; return render(); }
  st.cur = Math.min(Math.max(st.cur,0), l.length-1);
  const q = l[st.cur], p = permFor(q.n), chosen = st.ans[q.n], done = chosen !== undefined;
  $("qNum").textContent = "Question " + q.n + " of 200";
  $("qSec").textContent = secOf(q.n).name;
  $("qStar").hidden = !q.star;
  $("qPos").textContent = (st.cur+1) + " / " + l.length;
  $("qText").textContent = q.q;
  const box = $("opts"); box.innerHTML = "";
  p.forEach((oi, k) => {
    const b = document.createElement("button"); b.type="button"; b.className="opt"; b.id="opt-"+k;
    b.innerHTML = '<span class="letter">'+"ABCD"[k]+'</span><span class="txt"></span>';
    b.querySelector(".txt").textContent = q.o[oi];
    if (done) {
      b.disabled = true;
      if (oi === q.a) { b.classList.add("right"); b.insertAdjacentHTML("beforeend",'<span class="flag">Correct</span>'); }
      else if (oi === chosen) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="flag">Your answer</span>'); }
      else b.classList.add("dim");
    } else b.onclick = () => answer(q, oi);
    box.appendChild(b);
  });
  const fb = $("fb");
  if (done) {
    fb.hidden = false; fb.className = "feedback " + (chosen===q.a ? "ok" : "no");
    fb.textContent = chosen===q.a ? "Correct! " + q.o[q.a] + "." : "Not quite. The right answer is: " + q.o[q.a] + ".";
  } else fb.hidden = true;
  $("prevBtn").disabled = st.cur === 0;
  $("nextBtn").textContent = st.cur === l.length-1 ? "See summary" : "Next →";
}
function answer(q, oi){ st.ans[q.n] = oi; save(); renderStats(); renderQ(); renderGrid(); }
function renderGrid(){
  const g = $("grid"); if ($("palette").hidden) return; g.innerHTML = "";
  const l = list();
  l.forEach((q, i) => {
    const b = document.createElement("button"); b.type="button"; b.className="cell"; b.textContent=q.n;
    if (st.ans[q.n] !== undefined) b.classList.add(isOk(q) ? "ok" : "no");
    if (i === st.cur) b.classList.add("cur");
    b.setAttribute("aria-label","Question "+q.n);
    b.onclick = () => { st.cur=i; save(); hidePanels(); render(); $("qcard").scrollIntoView({block:"start"}); };
    g.appendChild(b);
  });
}
function renderSummary(){
  const done = Object.keys(st.ans).length, ok = QS.filter(isOk).length, wrongN = QS.filter(q => st.ans[q.n]!==undefined && !isOk(q));
  const acc = done ? Math.round(ok/done*100) : 0;
  let h = '<h2>Your score</h2><div class="tiles"><div class="tile"><b>'+ok+' / 200</b><small>Total score</small></div><div class="tile g"><b>'+acc+'%</b><small>Accuracy on answered</small></div><div class="tile r"><b>'+wrongN.length+'</b><small>Wrong answers</small></div></div>';
  SECTIONS.forEach(s => {
    const qs = QS.filter(q => q.n>=s.from && q.n<=s.to), a = qs.filter(q => st.ans[q.n]!==undefined).length, c = qs.filter(isOk).length;
    const pct = a ? Math.round(c/a*100) : 0;
    h += '<div class="sec"><div class="sec-top"><span>'+s.name+' <small>(Q'+s.from+'–'+s.to+')</small></span><span>'+c+'/'+qs.length+(a?' ('+pct+'%)':'')+'</span></div><div class="bar"><i style="width:'+(c/qs.length*100)+'%"></i></div><small>Attempted: '+a+'/'+qs.length+' · Incorrect: '+(a-c)+'</small></div>';
  });
  h += '<div class="tools"><button class="btn primary" type="button" id="retryBtn"'+(wrongN.length?'':' disabled')+'>Retry my '+wrongN.length+' wrong answers</button><button class="btn" type="button" id="backBtn">Back to questions</button></div>';
  const el = $("summary"); el.innerHTML = h;
  $("retryBtn").onclick = () => { const ids = wrongN.map(q => q.n); ids.forEach(n => { delete st.ans[n]; delete st.perm[n]; }); st.only = ids.join(","); st.filter="all"; st.cur=0; save(); hidePanels(); render(); };
  $("backBtn").onclick = () => { hidePanels(); render(); };
}
function hidePanels(){ $("palette").hidden = true; $("summary").hidden = true; $("qcard").hidden = false; $("palBtn").setAttribute("aria-pressed","false"); }
function render(){ renderChips(); renderStats(); renderQ(); renderGrid(); }

$("prevBtn").onclick = () => { st.cur--; save(); renderQ(); renderGrid(); };
$("nextBtn").onclick = () => { if (st.cur >= list().length-1) return showSummary(); st.cur++; save(); renderQ(); renderGrid(); };
function showSummary(){ $("palette").hidden = true; $("palBtn").setAttribute("aria-pressed","false"); $("qcard").hidden = true; $("summary").hidden = false; renderSummary(); $("summary").scrollIntoView({block:"start"}); }
$("sumBtn").onclick = showSummary;
$("palBtn").onclick = () => { const open = $("palette").hidden; hidePanels(); $("palette").hidden = !open; $("palBtn").setAttribute("aria-pressed", String(open)); renderGrid(); };
let armed = null;
$("resetBtn").onclick = () => {
  const b = $("resetBtn");
  if (!armed) { b.textContent = "Tap again to clear all answers"; armed = setTimeout(() => { armed=null; b.textContent="Reset"; }, 3000); return; }
  clearTimeout(armed); armed=null; b.textContent="Reset";
  st = {ans:{}, perm:{}, filter:"all", only:"", cur:0}; save(); hidePanels(); render();
};
$("themeBtn").onclick = () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  r.dataset.theme = cur === "dark" ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  if ($("qcard").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if (idx >= 0) { const b = $("opt-"+idx); if (b && !b.disabled) b.click(); }
  else if (e.key === "ArrowRight") $("nextBtn").click();
  else if (e.key === "ArrowLeft" && !$("prevBtn").disabled) $("prevBtn").click();
});
render();
</script>
